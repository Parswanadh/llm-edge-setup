# =============================================================================
# 99-llm-edge-memory.conf  —  memory/swap tuning for LFM2.5-24B-A2B on this box
# =============================================================================
# Target: 15 GiB RAM, /dev/zram0 (22.7 GiB, zstd) + /swap.img (4 GiB, NVMe),
#         8 GiB VRAM.  Model = 13.578 GB QAD-Q4_0, of which ~97 % is routed-expert
#         FFN tensors that are mmap'd file pages when --n-cpu-moe is used.
#
# Install with:
#     sudo install -m 0644 systemd/99-llm-edge-memory.conf /etc/sysctl.d/99-llm-edge-memory.conf
#     sudo sysctl --system
#
# REVERT:
#     sudo rm -f /etc/sysctl.d/99-llm-edge-memory.conf
#     sudo sysctl --system
#
# ---------------------------------------------------------------------------
# Measured on this machine (2026-10-22) — see docs/MEMORY-TUNING.md
# ---------------------------------------------------------------------------
# The mmap'd model weights are CLEAN, FILE-BACKED pages.  The kernel never
# writes clean file pages to swap: under memory pressure they are dropped and
# re-read from the NVMe.  Therefore:
#   * swap/zram configuration has ZERO effect on where the model lives.
#   * the model lives in the page cache (real RAM) or it is re-read from NVMe.
#   * swap configuration only matters INDIRECTLY: zram is what keeps cold
#     anonymous desktop memory out of real RAM, leaving RAM for the page
#     cache to hold the model.
#
# zram compresses this box's anonymous memory at ~3.6x (measured:
# orig_data_size 5.83 GB -> compr_data_size 1.38 GB), which frees ~4.4 GB of
# real RAM for the page cache.  That is the mechanism that makes the model
# resident.  Keep it.
#
# QAD-Q4_0 weight bytes are NOT compressible (measured: 64 MiB sample ->
# 65.58 MB under zstd -1, i.e. 1.02x).  If the model were ever pushed into
# swap, zram would store it 1:1 and charge us a decompression on every swap-in
# — strictly worse than leaving it in the page cache.  Do not try to "put the
# model in zram".
# ---------------------------------------------------------------------------

# Prefer swapping cold anonymous pages over reclaiming the page cache that
# holds the model.  KEEP at 180 (already set by 99-vm-zram-parameters.conf).
# NOTE: 180 is only safe because systemd/zram-memory-limit.service caps zram's
# real-RAM usage at 6 GiB.  Without that cap, swappiness 180 + a 22.7 GiB
# zram on a 15 GiB box can drive the box into the OOM killer.
vm.swappiness = 180

# Reclaim dentry/inode cache gently so the model's page cache survives.
# KEEP at 50 (already set by 99-vm-zram-parameters.conf).
vm.vfs_cache_pressure = 50

# No swap-in readahead clustering.  The expert reads are ~5 MiB random
# accesses, so swapin readahead only wastes I/O bandwidth.
# KEEP at 0 (already set by 99-vm-zram-parameters.conf).
# (The llama.cpp/WSL2 warning about page-cluster 8192 does NOT apply here:
#  the upstream default is 128 KB of read_ahead and this box verifies
#  /sys/block/nvme0n1/queue/read_ahead_kb = 128 with scheduler = none.)
vm.page-cluster = 0

# Keep the "high" watermark above total RAM so the kernel leans on swap
# (zram) instead of reclaiming the model's page cache.
# KEEP at 0 / 125 (already set by 99-vm-zram-parameters.conf).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Reserve a little more headroom for atomic allocations so that a model load
# does not stall in direct reclaim.  Default on this box is 67584 kB (66 MiB).
# OPTIONAL / NOT MEASURED — revert with: sudo sysctl -w vm.min_free_kbytes=67584
vm.min_free_kbytes = 131072
